Name: order.rpc
ListenOn: 0.0.0.0:9002
Etcd:
  Hosts:
  - 127.0.0.1:12379
  Key: order.rpc


Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3307)/mall?charset=utf8mb4&parseTime=true&loc=Local
CacheRedis:
  - Host: 127.0.0.1:16379
    Type: node # 单节点模式
    Pass:

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:12379
    Key: user.rpc

ProductRpc:
  Etcd:
    Hosts:
      - localhost:12379
    Key: product.rpc

Prometheus:
  Host: 0.0.0.0
  Port: 9092
  Path: /metrics

Telemetry:
  Name: order.rpc
  Endpoint: 127.0.0.1:14268
  Sampler: 1.0
  Batcher: otlphttp