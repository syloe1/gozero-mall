Name: pay.rpc
ListenOn: 0.0.0.0:9003
Etcd:
  Hosts:
    - 127.0.0.1:12379
  Key: pay.rpc
Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3307)/juejinmall?charset=utf8mb4&parseTime=true&loc=Local

CacheRedis:
  - Host: 127.0.0.1:16379
    Type: node # 单节点模式
    Pass:

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:12379
    Key: user.rpc

OrderRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:12379
    Key: order.rpc

Prometheus:
  Host: 0.0.0.0
  Port: 9093
  Path: /metrics


Telemetry:
  Name: pay.rpc
  Endpoint: http://jaeger:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger