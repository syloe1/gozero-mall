Name: user.rpc
ListenOn: 0.0.0.0:9000
Etcd:
  Hosts:
    - 127.0.0.1:12379
  Key: user.rpc
Mysql:
  DataSource: root:123456@tcp(127.0.0.1:3307)/mall?charset=utf8mb4&parseTime=true&loc=Local

CacheRedis:
  - Host: 127.0.0.1:16379
    Type: node # 单节点模式
    Pass:

Salt: HWVOFkGgPTryzICwd7qnJaZR9KQ2i8xe

Auth: false              # 是否开启 Auth 验证
StrictControl: false      # 是否开启严格模式
Redis:                   # 指定 Redis 服务
  Key: rpc:auth:user     # 指定 Key 应为 hash 类型
  Host: 127.0.0.1:16379
  Type: node
  Pass:

Prometheus:
  Host: 0.0.0.0
  Port: 9090
  Path: /metrics


Telemetry:
  Name: user.rpc
  Endpoint: 127.0.0.1:14268
  Sampler: 1.0
  Batcher: otlphttp